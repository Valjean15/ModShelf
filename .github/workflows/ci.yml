name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Installs the SDK that global.json asks for (10.0.x, rollForward: latestFeature).
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # The Linux secret store talks to a Secret Service, which GitHub's runners don't run, so install GNOME Keyring.
      - name: Install a keyring
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus

      # global.json selects Microsoft.Testing.Platform, so this runs every test project in the solution.
      - name: Test
        if: runner.os != 'Linux'
        run: dotnet test --no-build

      # The same tests inside a D-Bus session with an unlocked keyring, so the Secret Service tests run too.
      - name: Test (with a keyring)
        if: runner.os == 'Linux'
        run: dbus-run-session -- sh -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && dotnet test --no-build'
