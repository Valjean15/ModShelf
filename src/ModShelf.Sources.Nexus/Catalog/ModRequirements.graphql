# What a mod needs, for the Nexus source's IModRequirements, from the v2 API, by its game and ID: other mods on Nexus
# Mods, named by their game's number, and things elsewhere. DLC are left out until their type is recorded. The recording
# script reads this file too, so the recorded answers are to this exact query.
query ModRequirements($ids: [CompositeDomainWithIdInput!]!) {
  legacyModsByDomain(ids: $ids) {
    nodes {
      modId
      game {
        domainName
      }
      modRequirements {
        nexusRequirements {
          totalCount
          nodes {
            id
            modId
            modName
            gameId
            notes
            url
            externalRequirement
          }
        }
      }
    }
  }
}
