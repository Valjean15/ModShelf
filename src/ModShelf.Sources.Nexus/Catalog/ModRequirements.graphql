# What mods need, from the v2 API, by game and ID: other mods on Nexus Mods and things elsewhere. The fields are the ones
# the recorded schema lists; DLC are left out until their type is recorded. Not used by the source yet: the recording
# script reads this file, so the recorded answers are to this exact query, and step 8b builds on them.
query ModRequirements($ids: [CompositeDomainWithIdInput!]!) {
  legacyModsByDomain(ids: $ids) {
    nodes {
      modId
      game {
        domainName
      }
      modRequirements {
        nexusRequirements {
          totalCount
          nodes {
            id
            modId
            modName
            gameId
            notes
            url
            externalRequirement
          }
        }
      }
    }
  }
}
