# A mod's details from the v2 API: the one mod of a game with the ID the filter gives, with its thumbnails and its
# category's name, which v1 doesn't give. Not used by the source yet: the recording script reads this file, so the
# recorded answers are to this exact query, and step 8b builds on them.
query ModDetails($filter: ModsFilter) {
  mods(filter: $filter, count: 1) {
    nodes {
      modId
      name
      summary
      author
      version
      pictureUrl
      thumbnailUrl
      thumbnailBlurredUrl
      updatedAt
      endorsements
      downloads
      adultContent
      status
      category
      game {
        domainName
      }
    }
  }
}
