# Describes a mod for the Nexus source's IModCatalog, from the v2 API, by its game and ID: with its thumbnails and its
# category's name, which v1 doesn't give. "mods" refuses a mod ID without the game's number; legacyModsByDomain takes
# the game's domain name, and several mods at once. The recording script reads this file too, so the recorded answers
# are to this exact query.
query ModDetails($ids: [CompositeDomainWithIdInput!]!) {
  legacyModsByDomain(ids: $ids) {
    totalCount
    nodes {
      modId
      name
      summary
      author
      version
      pictureUrl
      thumbnailUrl
      thumbnailBlurredUrl
      updatedAt
      endorsements
      downloads
      adultContent
      status
      category
      modCategory {
        categoryId
        name
      }
      game {
        domainName
      }
    }
  }
}
