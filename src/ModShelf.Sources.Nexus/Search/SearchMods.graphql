# Searches one game's mods for the Nexus source's IModSearch. The recording script reads this file too, so the
# recorded answers are to this exact query.
query SearchMods($filter: ModsFilter, $sort: [ModsSort!], $offset: Int, $count: Int) {
  mods(filter: $filter, sort: $sort, offset: $offset, count: $count) {
    totalCount
    nodes {
      modId
      name
      summary
      author
      version
      pictureUrl
      updatedAt
      endorsements
      downloads
      adultContent
      status
      game {
        domainName
      }
    }
  }
}
